<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Complex Extension of y = x²</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>y = x² の複素数拡張（4D → 2D射影）</h2>

<div id="info">
  <div id="formula">y = x²</div>
  <div>入力点 x：<span id="input"></span></div>
  <div>出力点 y：<span id="output"></span></div>
</div>

<div>
  表示平面：
  <select onchange="setPlane(this.value)">
    <option value="reX-imX">reX × imX（入力平面）</option>
    <option value="reY-imY">reY × imY（出力平面）</option>
    <option value="reX-reY">reX × reY</option>
    <option value="reX-imY">reX × imY</option>
    <option value="imX-reY">imX × reY</option>
    <option value="imX-imY">imX × imY</option>
  </select>
</div>

<div id="controls">
  <button onclick="moveX(1,0)">Re(x)+1</button>
  <button onclick="moveX(-1,0)">Re(x)-1</button>
  <button onclick="moveX(0,1)">Im(x)+1</button>
  <button onclick="moveX(0,-1)">Im(x)-1</button>
  <button onclick="randomX()">ランダム</button>
</div>

<canvas id="canvas" width="420" height="420"></canvas>

<script src="main.js"></script>
</body>
</html>
