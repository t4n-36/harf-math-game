<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>複素関数可視化（4D→2D）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>複素関数の4次元→2次元可視化</h1>

<div id="ui">
  <div>
    関数：
    <select id="funcSelect">
      <option value="square">y = x²</option>
      <option value="cube">y = x³</option>
      <option value="quartic">y = x⁴</option>
      <option value="reciprocal">y = 1/x</option>
      <option value="exp">y = eˣ</option>
      <option value="sin">y = sin(x)</option>
    </select>
  </div>

  <div>
    表示平面：
    <select id="planeSelect">
      <option value="reX-reY">reX × reY</option>
      <option value="reX-imY">reX × imY</option>
      <option value="imX-reY">imX × reY</option>
      <option value="imX-imY">imX × imY</option>
    </select>
  </div>

  <div>
    表示モード：
    <label><input type="radio" name="mode" value="slice" checked>断面</label>
    <label><input type="radio" name="mode" value="surface">面</label>
  </div>

  <div id="fixedControls"></div>
</div>

<canvas id="canvas" width="500" height="500"></canvas>

<script src="main.js"></script>
</body>
</html>
