<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Complex Graph Transform Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>複素数グラフ変形ゲーム</h2>

<p id="info"></p>
<p>表示平面：
  <select id="plane">
    <option value="RxRy">Re(x) - Re(y)</option>
    <option value="RxIy">Re(x) - Im(y)</option>
    <option value="IxRy">Im(x) - Re(y)</option>
    <option value="IxIy">Im(x) - Im(y)</option>
    <option value="RyIy">Re(y) - Im(y)</option>
    <option value="RxIx">Re(x) - Im(x)</option>
  </select>
</p>

<div class="buttons">
  <button id="px">+1</button>
  <button id="mx">-1</button>
  <button id="pi">+i</button>
  <button id="mi">-i</button>
  <button id="rot">回転 × i</button>
  <button id="new">🔄 新しい問題</button>
</div>

<canvas id="canvas" width="400" height="400"></canvas>

<p id="result"></p>

<script src="main.js"></script>
</body>
</html>
