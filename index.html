<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>4次元断面グラフゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>実関数 × 複素数拡張（4D → 2D 可視化）</h2>

<div id="ui">
  <div>
    表示平面：
    <select id="plane" onchange="draw()">
      <option value="reX-reY">reX × reY</option>
      <option value="reX-imY">reX × imY</option>
      <option value="imX-reY">imX × reY</option>
      <option value="imX-imY">imX × imY</option>
      <option value="reX-imX">reX × imX</option>
      <option value="reY-imY">reY × imY</option>
    </select>
  </div>

  <div>
    表示モード：
    <select id="mode" onchange="draw()">
      <option value="slice">断面</option>
      <option value="surface">面</option>
    </select>
  </div>

  <div>
    固定値：
    <input id="fixedVal" type="number" min="-5" max="5" value="0" onchange="draw()">
  </div>
</div>

<canvas id="canvas" width="500" height="500"></canvas>

<div id="info">
  <div id="axisInfo"></div>
  <div id="calcInfo"></div>
</div>

<script src="main.js"></script>
</body>
</html>
