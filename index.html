<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Complex Plane Projection Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>複素数グラフ変形ゲーム（4軸→2平面）</h2>

<div id="info">
  <div id="formula"></div>
  <div>目標点：<span id="target"></span></div>
</div>

<div id="projection">
  表示平面：
  <select onchange="setPlane(this.value)">
    <option value="reX-reY">reX × reY</option>
    <option value="reX-imX">reX × imX</option>
    <option value="reX-imY">reX × imY</option>
    <option value="reY-imX">reY × imX</option>
    <option value="reY-imY">reY × imY</option>
    <option value="imX-imY">imX × imY</option>
  </select>
</div>

<div id="controls">
  <button onclick="addRe()">Re +1</button>
  <button onclick="addIm()">Im +1</button>
  <button onclick="rotate()">× i</button>
  <button onclick="newProblem()">新しい問題</button>
</div>

<canvas id="canvas" width="420" height="420"></canvas>

<div id="result"></div>

<script src="main.js"></script>
</body>
</html>
